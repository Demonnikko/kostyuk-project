<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Страница не найдена | 404 | Дмитрий Костюк</title>
  <link rel="stylesheet" href="/vendor/fonts/fonts.css">
  <style>
    :root {
      --bg: #050505;
      --gold: #CBA135;
      --gold-bright: #F0D98B;
      --violet: #8c50dc;
      --cream: #F5F0E5;
      --ff-head: 'Cinzel', 'Georgia', serif;
      --ff-text: 'Inter', 'Arial', sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg);
      background-image: 
        radial-gradient(circle at 50% 40%, rgba(140, 80, 220, 0.12) 0%, transparent 60%),
        radial-gradient(circle at 50% 60%, rgba(203, 161, 53, 0.06) 0%, transparent 50%);
      color: var(--cream);
      font-family: var(--ff-text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
      overflow: hidden;
      position: relative;
    }

    /* Embers/sparks background */
    .sparks {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1;
    }
    .spark {
      position: absolute;
      bottom: -10px;
      width: 3px;
      height: 3px;
      background: var(--gold-bright);
      border-radius: 50%;
      opacity: 0;
      animation: rise 8s infinite ease-in;
      box-shadow: 0 0 8px var(--gold);
    }
    @keyframes rise {
      0% { transform: translateY(0) scale(1); opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.6; }
      100% { transform: translateY(-110vh) translateX(50px) scale(0.3); opacity: 0; }
    }

    .error-wrap {
      max-width: 600px;
      z-index: 10;
      position: relative;
    }

    .magic-wand-icon {
      font-size: 64px;
      margin-bottom: 24px;
      display: inline-block;
      animation: waveWand 4s ease-in-out infinite;
      filter: drop-shadow(0 0 20px rgba(140, 80, 220, 0.6));
    }
    @keyframes waveWand {
      0%, 100% { transform: rotate(0deg) scale(1); }
      50% { transform: rotate(15deg) scale(1.08); }
    }

    .code {
      font-family: var(--ff-head);
      font-size: clamp(80px, 15vw, 150px);
      font-weight: 900;
      line-height: 1;
      background: linear-gradient(135deg, #fff 0%, var(--gold-bright) 45%, var(--violet) 100%);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      text-shadow: 0 0 40px rgba(140, 80, 220, 0.25);
      margin-bottom: 12px;
      letter-spacing: 0.05em;
    }

    .title {
      font-family: var(--ff-head);
      font-size: clamp(20px, 4vw, 32px);
      color: var(--cream);
      margin-bottom: 16px;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    }

    .desc {
      font-size: clamp(14px, 1.8vw, 17px);
      color: rgba(245, 240, 229, 0.65);
      line-height: 1.6;
      max-width: 460px;
      margin: 0 auto 36px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 16px 36px;
      font-family: var(--ff-text);
      font-size: 13px;
      font-weight: 800;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: #050505;
      background: linear-gradient(135deg, var(--gold-bright), var(--gold));
      border: none;
      border-radius: 50px;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 6px 25px rgba(203, 161, 53, 0.28);
      transition: transform 0.3s cubic-bezier(0.25, 1, 0.5, 1), box-shadow 0.3s ease;
    }

    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(203, 161, 53, 0.45);
    }

    .btn:active {
      transform: translateY(0);
    }
  </style>
</head>
<body>
  <div class="sparks" id="sparks"></div>

  <div class="error-wrap">
    <div class="magic-wand-icon">🪄</div>
    <div class="code">404</div>
    <h1 class="title">Магия не сработала</h1>
    <p class="desc">Кажется, эта страница исчезла... как по мановению волшебной палочки.</p>
    <a href="/" class="btn">Вернуться в реальность</a>
  </div>

  <script>
    // Create animated sparks
    (function() {
      var sparksContainer = document.getElementById('sparks');
      if (!sparksContainer) return;
      for (var i = 0; i < 25; i++) {
        var s = document.createElement('div');
        s.className = 'spark';
        s.style.left = Math.random() * 100 + 'vw';
        s.style.animationDuration = (5 + Math.random() * 6) + 's';
        s.style.animationDelay = (Math.random() * 6) + 's';
        s.style.transform = 'scale(' + (0.5 + Math.random() * 1.5) + ')';
        sparksContainer.appendChild(s);
      }
    })();
  </script>
