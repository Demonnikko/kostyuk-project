<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#030303" />
    <title>Авторские шоу</title>
    <link rel="stylesheet" href="./styles.css?v=3" />
  </head>
  <body>
    <main id="app" class="app-shell">
      <section class="state-view" data-state="loading" role="status" aria-label="Загрузка афиши">
        <span class="loader" aria-hidden="true"></span>
        <p>Загружаем афишу…</p>
      </section>
    </main>
    <noscript>Для просмотра афиши включите JavaScript.</noscript>
    <!-- VK Bridge: связь с VK. Обязателен VKWebAppInit, иначе VK показывает
         «Приложение не инициализировано». Грузим ЛОКАЛЬНО (не с unpkg — тот
         блокируется в РФ белыми списками, ради обхода которых и делается Mini App).
         Даёт window.vkBridge. -->
    <script src="../vendor/vk-bridge/vk-bridge.min.js?v=3"></script>
    <script type="module" src="./app.js?v=3"></script>
  </body>
</html>
